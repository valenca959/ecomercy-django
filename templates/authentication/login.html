{% extends 'base.html' %}

{% block title %}Entrar · Ecomercy{% endblock %}

{% block content %}
  <h1>Entrar</h1>

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>

  <p><a href="{% url 'password_reset' %}">Esqueci minha senha</a></p>
  <p>Não tem conta? <a href="{% url 'signup-client' %}">Criar conta de cliente</a>
    ou <a href="{% url 'signup-seller' %}">de vendedor</a>.</p>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Nova senha · Ecomercy{% endblock %}

{% block content %}
  <h1>Definir nova senha</h1>

  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Salvar nova senha</button>
    </form>
  {% else %}
    <p>Este link é inválido ou já foi usado.
      <a href="{% url 'password_reset' %}">Solicite um novo link</a>.</p>
  {% endif %}
{% endblock %}

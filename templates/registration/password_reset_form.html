{% extends 'base.html' %}

{% block title %}Esqueci minha senha · Ecomercy{% endblock %}

{% block content %}
  <h1>Esqueci minha senha</h1>
  <p>Informe o email da sua conta e enviaremos um link para redefinir a senha.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar link</button>
  </form>
{% endblock %}
